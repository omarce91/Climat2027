name: Climat2027 — Automatisations

on:
  schedule:
    # ── Dimanche 10 h Paris (9 h UTC hiver / 8 h UTC été) — infographie og_image.jpg
    - cron: '0 9 * * 0'
    # ── Lundi + jeudi 7 h Paris (5 h UTC) — analyse débats (si nouveaux transcripts)
    - cron: '0 5 * * 1,4'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job à lancer (all / infographie / debats / gaspar / bluesky)'
        required: false
        default: 'all'

permissions:
  contents: write

env:
  PYTHON: python3

# ════════════════════════════════════════════════════════════════════════════
jobs:

  # ── 1. Mise à jour de l'infographie OG chaque dimanche ──────────────────
  maj_infographie:
    name: "Infographie OG (dimanche)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == '' || github.event.inputs.job == 'all' || github.event.inputs.job == 'infographie') || github.event_name == 'schedule' && github.event.schedule == '0 9 * * 0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer dépendances
        run: pip install matplotlib pillow atproto mistralai --quiet

      - name: Écrire credentials.json
        env:
          BSKY_C27_HANDLE:       ${{ secrets.BSKY_C27_HANDLE }}
          BSKY_C27_APP_PASSWORD: ${{ secrets.BSKY_C27_APP_PASSWORD }}
          MISTRAL_API_KEY:       ${{ secrets.MISTRAL_API_KEY }}
        run: |
          cat > credentials.json <<EOF
          {
            "handle_c27":       "$BSKY_C27_HANDLE",
            "app_password_c27": "$BSKY_C27_APP_PASSWORD",
            "mistral_api_key":  "$MISTRAL_API_KEY"
          }
          EOF

      - name: Surveiller nouveaux candidats et sources
        continue-on-error: true
        run: python3 veille_candidats.py

      - name: Consulter les sources et mettre à jour candidats.json
        run: |
          python update_sources.py && echo "✓ sources mises à jour" || {
            echo "⚠️  update_sources.py a échoué — vérifier les logs ci-dessus"
            echo "   L'infographie sera générée avec les données existantes"
            exit 0
          }

      - name: Générer og_image.jpg
        # La date de consultation est lue automatiquement depuis sources.json
        run: python generate_og.py --out images/og_image.jpg

      - name: Archiver og_image.jpg et générer l'historique
        run: |
          DATE=$(date -u +%Y-%m-%d)
          cp images/og_image.jpg "images/og_image_${DATE}.jpg"
          echo "✓ og_image_${DATE}.jpg créé"

          # Initialiser archives.json si absent
          [ -f images/archives.json ] || echo '[]' > images/archives.json

          # Ajouter l'entrée si pas déjà présente
          URL="https://climat2027.fr/images/og_image_${DATE}.jpg"
          if ! jq -e --arg d "$DATE" 'any(.[]; .date == $d)' images/archives.json >/dev/null 2>&1; then
            TMP=$(mktemp)
            jq --arg d "$DATE" --arg u "$URL" '[{"date": $d, "url": $u}] + .' images/archives.json > "$TMP"
            mv "$TMP" images/archives.json
            echo "✓ archives.json: $(jq length images/archives.json) entrées"
          else
            echo "ℹ archives.json: entrée $DATE déjà présente"
          fi

          # Générer archives.html
          COUNT=$(jq length images/archives.json)
          {
            echo '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">'
            echo '<title>Historique des infographies — #Climat2027</title>'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<style>body{font-family:sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;background:#1a1a2e;color:#eee}h1{color:#4ade80}a{color:#86efac}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem;margin-top:2rem}.card{background:#0f3460;border-radius:8px;overflow:hidden}.card img{width:100%;display:block}.card p{padding:.5rem 1rem;margin:0;font-size:.85rem;color:#aaa}</style>'
            echo '</head><body>'
            echo '<h1>#Climat2027 — Historique des infographies</h1>'
            echo "<p>${COUNT} infographie(s) — <a href=\"/\">← Retour à l'accueil</a></p>"
            echo '<div class="grid">'
            jq -r '.[] | "<div class=\"card\"><a href=\"\(.url)\"><img src=\"\(.url)\" alt=\"Infographie \(.date)\" loading=\"lazy\"></a><p>\(.date)</p></div>"' images/archives.json
            echo '</div></body></html>'
          } > images/archives.html
          echo "✓ archives.html généré (${COUNT} infographies)"

      - name: Mettre à jour les dates dans index.html
        run: python3 update_index.py

      - name: Poster l'infographie sur climat2027.bsky.social
        run: python post_infographie_bsky.py --image images/og_image.jpg

      - name: Envoyer les images et archives sur climat2027.fr (SFTP)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_KEY:  ${{ secrets.SFTP_KEY }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p ~/.ssh
          echo "$SFTP_KEY" > ~/.ssh/gandi_deploy
          chmod 600 ~/.ssh/gandi_deploy
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # .htaccess anti-cache pour og_image.jpg
          {
            echo '<FilesMatch "og_image\.jpg$">'
            echo '  Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"'
            echo '  Header set Pragma "no-cache"'
            echo '  Header set Expires "0"'
            echo '</FilesMatch>'
          } > /tmp/images_htaccess
          {
            echo "put index.html vhosts/climat2027.fr/htdocs/index.html"
            echo "put images/og_image.jpg vhosts/climat2027.fr/htdocs/images/og_image.jpg"
            echo "put images/og_image_${DATE}.jpg vhosts/climat2027.fr/htdocs/images/og_image_${DATE}.jpg"
            echo "put images/archives.html vhosts/climat2027.fr/htdocs/images/archives.html"
            echo "put images/archives.json vhosts/climat2027.fr/htdocs/images/archives.json"
            echo "put /tmp/images_htaccess vhosts/climat2027.fr/htdocs/images/.htaccess"
          } | sftp -i ~/.ssh/gandi_deploy \
                   -o StrictHostKeyChecking=no \
                   -b - "$SFTP_USER@$SFTP_HOST"
          echo "✓ images, archives et .htaccess anti-cache envoyés sur $SFTP_HOST"

      - name: Commiter candidats.json, sources.json et archives
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/gen/images
          [ -f candidats.json ]       && cp candidats.json       /tmp/gen/        || true
          [ -f sources.json ]         && cp sources.json         /tmp/gen/        || true
          [ -f CHANGES.md ]           && cp CHANGES.md           /tmp/gen/        || true
          [ -f index.html ]           && cp index.html           /tmp/gen/        || true
          [ -f veille.txt ]           && cp veille.txt           /tmp/gen/        || true
          [ -f images/archives.json ] && cp images/archives.json /tmp/gen/images/ || true
          git fetch origin main
          git reset --hard origin/main
          [ -f /tmp/gen/candidats.json ]       && cp /tmp/gen/candidats.json       .       || true
          [ -f /tmp/gen/sources.json ]         && cp /tmp/gen/sources.json         .       || true
          [ -f /tmp/gen/CHANGES.md ]           && cp /tmp/gen/CHANGES.md           .       || true
          [ -f /tmp/gen/index.html ]           && cp /tmp/gen/index.html           .       || true
          [ -f /tmp/gen/veille.txt ]           && cp /tmp/gen/veille.txt           .       || true
          mkdir -p images
          [ -f /tmp/gen/images/archives.json ] && cp /tmp/gen/images/archives.json images/ || true
          git add candidats.json sources.json CHANGES.md index.html images/archives.json veille.txt || true
          git diff --cached --quiet || git commit -m "chore: sources + index + archives $(date -u +%Y-%m-%d)"
          git push

  # ── 2. Analyse des débats (transcripts dans transcripts/) ────────────────
  analyse_debats:
    name: "Analyse débats & discours"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == '' || github.event.inputs.job == 'all' || github.event.inputs.job == 'debats') || github.event_name == 'schedule' && github.event.schedule == '0 5 * * 1,4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Récupérer les nouveaux transcripts
        continue-on-error: true
        run: python3 fetch_transcripts.py --output transcripts/ --max 10

      - name: Analyser les transcripts
        run: |
          if [ -d transcripts ] && ls transcripts/*.{txt,json} 1>/dev/null 2>&1; then
            python analyse_debats.py --input transcripts/ --output debats_stats.json
          else
            echo "Aucun transcript — génération du jeu de démonstration."
            python analyse_debats.py --demo --output debats_stats.json
          fi

      - name: Commiter debats_stats.json et transcripts si modifiés
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debats_stats.json || true
          git add transcripts/*.json transcripts/*.txt 2>/dev/null || true
          git pull --rebase --autostash origin main
          git diff --cached --quiet || git commit -m "data: debats_stats + transcripts $(date -u +%Y-%m-%d)"
          git push

  # ── 3. Carte GASPAR + post Bluesky ──────────────────────────────────────
  gaspar_bluesky:
    name: "GASPAR → Bluesky"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == '' || github.event.inputs.job == 'all' || github.event.inputs.job == 'gaspar' || github.event.inputs.job == 'bluesky')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer dépendances
        run: pip install atproto matplotlib pillow requests --quiet

      - name: Écrire credentials.json
        env:
          BSKY_HANDLE:        ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD:  ${{ secrets.BSKY_APP_PASSWORD }}
          BSKY_C27_HANDLE:    ${{ secrets.BSKY_C27_HANDLE }}
          BSKY_C27_APP_PASSWORD: ${{ secrets.BSKY_C27_APP_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "handle":              "$BSKY_HANDLE",
            "app_password":        "$BSKY_APP_PASSWORD",
            "handle_c27":          "$BSKY_C27_HANDLE",
            "app_password_c27":    "$BSKY_C27_APP_PASSWORD",
            "linkedin_access_token": "",
            "linkedin_person_id":    ""
          }
          EOF

      - name: Post GASPAR
        run: python post_gaspar_bluesky.py

      - name: Sauvegarder état (gaspar + repost)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f gaspar_map_state.json omarce_repost_state.json commune_coords_cache.json || true
          git pull --rebase --autostash origin main
          git diff --cached --quiet || git commit -m "state: gaspar+repost $(date -u +%Y-%m-%d)"
          git push

  # ── 4. Post quotidien Bluesky (likes → reply + repost omarce) ───────────
  bluesky_daily:
    name: "Bluesky — reply & repost quotidien"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == '' || github.event.inputs.job == 'all' || github.event.inputs.job == 'bluesky')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer dépendances
        run: pip install atproto matplotlib pillow requests --quiet

      - name: Écrire credentials.json
        env:
          BSKY_HANDLE:           ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD:     ${{ secrets.BSKY_APP_PASSWORD }}
          BSKY_C27_HANDLE:       ${{ secrets.BSKY_C27_HANDLE }}
          BSKY_C27_APP_PASSWORD: ${{ secrets.BSKY_C27_APP_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "handle":              "$BSKY_HANDLE",
            "app_password":        "$BSKY_APP_PASSWORD",
            "handle_c27":          "$BSKY_C27_HANDLE",
            "app_password_c27":    "$BSKY_C27_APP_PASSWORD",
            "linkedin_access_token": "",
            "linkedin_person_id":    ""
          }
          EOF

      - name: Lancer climat2027.py (reply mode)
        run: python climat2027.py --mode reply

      - name: Sauvegarder états (repost omarce + replies c27)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f omarce_repost_state.json c27_reply_state.json || true
          git pull --rebase --autostash origin main
          git diff --cached --quiet || git commit -m "state: omarce_repost+c27_reply $(date -u +%Y-%m-%d)"
          git push
