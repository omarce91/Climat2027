name: Climat2027 — posts quotidiens

on:
  schedule:
    - cron: '0 7 * * *'    # 7h UTC = 9h Paris (été)
    - cron: '0 8 * * *'    # 8h UTC = 9h Paris (hiver)
    - cron: '0 11 * * *'   # 11h UTC = 13h Paris (été)
    - cron: '0 12 * * *'   # 12h UTC = 13h Paris (hiver)
    - cron: '0 6 * * 0'    # 6h UTC dimanche = 8h Paris → mise à jour infographie
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (all, carte_gaspar, linkedin)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  # ── Job 1 : 9h — Bluesky commune + stats + likes ──────────────────
  post_quotidien:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'all')
      || (github.event_name == 'schedule' && (github.event.schedule == '0 7 * * *' || github.event.schedule == '0 8 * * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installe les dépendances
        run: pip install -r requirements.txt

      - name: Crée credentials.json
        run: |
          cat > credentials.json << CREDS
          {
            "handle":                 "${{ secrets.BSKY_HANDLE }}",
            "app_password":           "${{ secrets.BSKY_APP_PASSWORD }}",
            "handle_c27":             "${{ secrets.BSKY_C27_HANDLE }}",
            "app_password_c27":       "${{ secrets.BSKY_C27_APP_PASSWORD }}",
            "mistral_api_key":        "${{ secrets.MISTRAL_API_KEY }}",
            "linkedin_access_token":  "${{ secrets.LINKEDIN_ACCESS_TOKEN }}",
            "linkedin_person_id":     "${{ secrets.LINKEDIN_PERSON_ID }}"
          }
          CREDS

      - name: Bluesky — post commune + stats + likes
        run: |
          python climat2027.py \
            --map-url "${{ vars.MAP_URL || 'https://omarce91.github.io/Climat2027/' }}"

      - name: LinkedIn — post commune
        run: python linkedin.py --mode commune
        continue-on-error: true   # ne bloque pas si LinkedIn échoue

      - name: Sauvegarde les fichiers d'état
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json markers.json humor_state.json \
                  humor_reply_state.json humor_stats.json \
                  commune_coords_cache.json gaspar_map_state.json \
                  linkedin_state.json || true
          git diff --cached --quiet || \
            git commit -m "Post automatique $(date +%F)"
          git push

  # ── Job 2 : 13h — Bluesky + LinkedIn carte GASPAR ─────────────────
  carte_gaspar:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'carte_gaspar')
      || (github.event_name == 'schedule' && (github.event.schedule == '0 11 * * *' || github.event.schedule == '0 12 * * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installe les dépendances
        run: pip install -r requirements.txt

      - name: Crée credentials.json
        run: |
          cat > credentials.json << CREDS
          {
            "handle":                 "${{ secrets.BSKY_HANDLE }}",
            "app_password":           "${{ secrets.BSKY_APP_PASSWORD }}",
            "handle_c27":             "${{ secrets.BSKY_C27_HANDLE }}",
            "app_password_c27":       "${{ secrets.BSKY_C27_APP_PASSWORD }}",
            "linkedin_access_token":  "${{ secrets.LINKEDIN_ACCESS_TOKEN }}",
            "linkedin_person_id":     "${{ secrets.LINKEDIN_PERSON_ID }}"
          }
          CREDS

      - name: Bluesky — carte #CommunesSinistreesDuJour
        run: python post_gaspar_bluesky.py

      - name: LinkedIn — carte #CommunesSinistreesDuJour
        run: |
          GASPAR=$(ls catnat_gaspar*.csv 2>/dev/null | tail -1)
          [ -n "$GASPAR" ] && python linkedin.py --mode gaspar --gaspar-csv "$GASPAR"
        continue-on-error: true

      - name: Sauvegarde les fichiers d'état
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add commune_coords_cache.json gaspar_map_state.json \
                  linkedin_state.json || true
          git diff --cached --quiet || \
            git commit -m "Carte GASPAR $(date +%F)"
          git push

  # ── Job 3 : Dimanche — mise à jour de l'infographie ───────────────
  maj_infographie:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'all')
      || (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installe les dépendances
        run: pip install matplotlib pillow

      - name: Régénère og_image.jpg avec la date du jour
        run: python generate_og.py --out images/og_image.jpg

      - name: Commit si l'image a changé
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/og_image.jpg
          git diff --cached --quiet || \
            git commit -m "infographie : mise à jour du $(date +%d/%m/%Y)"
          git push
